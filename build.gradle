plugins {
    // AGP 9 provides built-in Kotlin, so org.jetbrains.kotlin.android is dropped
    // (AGP 9 rejects it); only the Compose compiler plugin is applied.
    id 'com.android.application' version '9.4.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
    // Google Play upload (Gradle Play Publisher). Applied conditionally in app/build.gradle
    // only when a Play Developer API service-account JSON is supplied.
}
