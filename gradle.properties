android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g
android.suppressUnsupportedCompileSdk=37

# Cefrium SDK source: 'registry' (maven.cefrium.com, the default - what external
# clones and published releases use) or 'local' (in-tree SDK + plugin, for
# developing the SDK without publishing). Override per build with
# -PcefriumSource=local. cefriumVersion is the registry coordinate version.
cefriumSource=registry
cefriumVersion=0.21.0
cefriumPreparedFor=0.21.0
